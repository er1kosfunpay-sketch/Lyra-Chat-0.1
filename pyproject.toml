[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "conversation-llm"
version = "0.1.0"
description = "A from-scratch GPT-1/GPT-2 style Russian conversational language model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.3,<3",
    "tokenizers>=0.15,<1",
    "numpy>=1.26,<3",
    "PyYAML>=6.0,<7",
    "tqdm>=4.66,<5",
    "safetensors>=0.4,<1",
    "requests>=2.31,<3",
    "datasets>=2.19,<6",
    "huggingface_hub>=0.23,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:timm.*",
]

[tool.ruff]
line-length = 110
target-version = "py310"
